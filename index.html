<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>Undangan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">
<meta name="color-scheme" content="light dark">
<script>
// Set tema sebelum CSS dipakai (hindari flash): pakai preferensi sistem atau pilihan tersimpan
(function(){
  try{
    var saved = localStorage.getItem('theme');
    var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  }catch(e){}
})();
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="stage">
<div class="frame" id="frame">
  <div class="header">
    <div class="brand-mark brand-mark--host" id="hostMark">
      <span class="wordmark" id="hostTag">WARGAVI48</span>
    </div>
    <div class="brand-mark brand-mark--brand" id="brandMark">
      <span class="wordmark wordmark--brand" id="brandTag">KODOKNYAMAURA</span>
    </div>
  </div>

  <div class="slides" id="slides">

    <!-- SLIDE 1: COVER -->
    <div class="slide slide--cover">
      <div class="cover-scrim" aria-hidden="true"></div>
      <div class="cover-body">
        <span class="pill pill--category" id="categoryLabel">Undangan</span>
        <div class="eyebrow">Dear,</div>
        <div class="guest-name" id="guestName">Tamu Undangan</div>
      </div>
      <button class="button button--primary" id="openBtn" data-cuelume-press data-cuelume-release>
        <span>Buka Undangan</span>
        <span class="button__divider"></span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M6 13l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>

    <!-- SLIDE 2: SURAT UNDANGAN -->
    <div class="slide slide--letter">
      <div class="letter-brand">
        <img class="letter-brand__img" id="letterBrandImg" alt="KodoknyaMaura" />
      </div>
      <div class="letter">
        <p class="letter__salutation">Dear <span id="guestName2">Tamu Undangan</span>,</p>
        <p class="letter__intro" id="hostGreeting">It is a pleasure to invite you to</p>
        <div class="letter__honoree" id="honoree">Maura Nilambari</div>
        <p class="letter__intro" id="hostGreetingAfter">…</p>
        <div class="letter__rule" aria-hidden="true"></div>
        <div class="letter__details-title">Stream Details</div>
        <div class="letter__meta">
          <div class="letter__row">
            <span class="letter__label">Date</span>
            <span class="letter__value" id="eventDate">-</span>
          </div>
          <div class="letter__row">
            <span class="letter__label">Time</span>
            <span class="letter__value" id="eventTime">-</span>
          </div>
          <div class="letter__row">
            <span class="letter__label">Link</span>
            <span class="letter__value"><a id="eventPlace" href="#" target="_blank" rel="noopener">-</a></span>
          </div>
        </div>
        <p class="letter__closing" id="closingMessage">Terima kasih.</p>
      </div>
    </div>

  </div>

  <div class="nav">
    <div class="dots" id="dots">
      <div class="dot active" data-cuelume-hover="tick" data-cuelume-press></div>
      <div class="dot" data-cuelume-hover="tick" data-cuelume-press></div>
    </div>
  </div>
</div>

  <div class="stage-tools">
    <button class="save-btn" id="saveBtn" type="button" data-cuelume-press data-cuelume-release>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 21h16" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Simpan sebagai PNG
    </button>
    <button class="theme-btn" id="themeBtn" type="button" aria-label="Ganti tema terang/gelap" title="Ganti tema">
      <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M19.1 4.9l-1.8 1.8M6.7 17.3l-1.8 1.8"/></svg>
      <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
    </button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="config.js"></script>
<script>
(function(){
  const { SUPABASE_URL, SUPABASE_ANON_KEY, EVENT } = window.__INVITATION_CONFIG__;
  const supabase = (SUPABASE_URL.startsWith("http"))
    ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
    : null;

  // ---- Fill static content from config ----
  document.getElementById('hostTag').textContent = EVENT.hostTag;
  document.getElementById('brandTag').textContent = EVENT.brandTag;

  function renderMark(containerId, logoUrl, fallbackText, wordmarkClass, logoHeight){
    if (!logoUrl) return; // no logo configured yet — keep the text wordmark as-is
    const container = document.getElementById(containerId);
    const img = document.createElement('img');
    img.src = logoUrl;
    img.alt = fallbackText;
    img.className = 'brand-mark__logo';
    if (logoHeight) img.style.setProperty('--logo-height', logoHeight + 'px');
    img.onerror = function(){
      container.innerHTML = '';
      const span = document.createElement('span');
      span.className = 'wordmark' + (wordmarkClass ? ' ' + wordmarkClass : '');
      span.textContent = fallbackText;
      container.appendChild(span);
    };
    container.innerHTML = '';
    container.appendChild(img);
  }
  renderMark('hostMark', EVENT.hostLogoUrl, EVENT.hostTag, '', EVENT.hostLogoHeight);
  renderMark('brandMark', EVENT.brandLogoUrl, EVENT.brandTag, 'wordmark--brand', EVENT.brandLogoHeight);

  // Logo brand di slide 2 (surat) — tampil terpusat di atas kartu surat
  const letterBrandImg = document.getElementById('letterBrandImg');
  if (letterBrandImg){
    if (EVENT.brandLogoUrl){
      letterBrandImg.src = EVENT.brandLogoUrl;
      if (EVENT.brandLogoHeight) letterBrandImg.style.setProperty('--logo-height', EVENT.brandLogoHeight + 'px');
      letterBrandImg.onerror = function(){ letterBrandImg.style.display = 'none'; };
    } else {
      letterBrandImg.style.display = 'none';
    }
  }

  document.getElementById('categoryLabel').textContent = EVENT.category || 'Undangan';
  document.getElementById('hostGreeting').textContent = EVENT.hostGreeting;
  const honoreeEl = document.getElementById('honoree');
  if (honoreeEl) honoreeEl.textContent = EVENT.honoreeName || '';
  const hostGreetingAfterEl = document.getElementById('hostGreetingAfter');
  if (hostGreetingAfterEl) hostGreetingAfterEl.textContent = EVENT.hostGreetingAfter || '';
  const eventDateEl = document.getElementById('eventDate');
  const eventTimeEl = document.getElementById('eventTime');
  if (eventDateEl) eventDateEl.textContent = EVENT.date;
  if (eventTimeEl) eventTimeEl.textContent = EVENT.time;
  const placeEl = document.getElementById('eventPlace');
  placeEl.textContent = EVENT.place;
  placeEl.href = EVENT.placeMapUrl || '#';
  document.getElementById('closingMessage').textContent = EVENT.closingMessage;

  // ---- Guest lookup by slug (?to=slug) ----
  const params = new URLSearchParams(window.location.search);
  const slug = params.get('to');
  let guestId = null;

  async function loadGuest(){
    let name = EVENT.defaultGuestName;
    if (slug && supabase){
      try{
        const { data, error } = await supabase
          .from('guests')
          .select('*')
          .eq('slug', slug)
          .single();
        if (!error && data){
          name = data.greeting || data.name;
          guestId = data.id;
        }
      }catch(e){ console.warn('Guest lookup failed', e); }
    }
    document.getElementById('guestName').textContent = name;
    document.getElementById('guestName2').textContent = name;
  }
  loadGuest();

  async function markOpened(){
    if (guestId && supabase){
      try{
        await supabase.from('guests').update({ opened_at: new Date().toISOString() }).eq('id', guestId);
      }catch(e){ console.warn('Failed to mark opened', e); }
    }
  }

  // ---- Slide navigation ----
  const slidesEl = document.getElementById('slides');
  const dots = document.querySelectorAll('.dot');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const total = 2;
  let current = 0;

  function render(){
    slidesEl.style.transform = `translateY(-${current * (100/total)}%)`;
    dots.forEach((d,i)=> d.classList.toggle('active', i===current));
    if (prevBtn) prevBtn.disabled = current===0;
    if (nextBtn) nextBtn.disabled = current===total-1;
  }
  function goTo(i){
    current = Math.max(0, Math.min(total-1, i));
    render();
  }

  document.getElementById('openBtn').addEventListener('click', ()=>{
    markOpened();
    goTo(1);
  });
  if (prevBtn) prevBtn.addEventListener('click', ()=> goTo(current-1));
  if (nextBtn) nextBtn.addEventListener('click', ()=> goTo(current+1));
  dots.forEach((d,i)=> d.addEventListener('click', ()=> goTo(i)));

  // swipe support
  let touchStart = null;
  const frame = document.getElementById('frame');
  frame.addEventListener('touchstart', e=>{ touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY }; });
  frame.addEventListener('touchend', e=>{
    if (touchStart===null) return;
    const dy = e.changedTouches[0].clientY - touchStart.y;
    touchStart = null;
    if (Math.abs(dy) > 40){ dy < 0 ? goTo(current+1) : goTo(current-1); }
  });

  render();
})();
</script>

<script>
// ---- Simpan undangan sebagai gambar PNG ----
(function(){
  const saveBtn = document.getElementById('saveBtn');
  if (!saveBtn || !window.html2canvas) return;

  saveBtn.addEventListener('click', async ()=>{
    const frameEl = document.getElementById('frame');
    const navEl = document.querySelector('.nav');
    const logos = Array.from(document.querySelectorAll('.brand-mark__logo'));
    saveBtn.disabled = true;
    if (navEl) navEl.style.display = 'none'; // sembunyikan tombol nav biar hasilnya rapi

    // html2canvas tidak mendukung object-fit:contain → samakan ukuran kotak img dengan rasio
    // asli gambar, supaya logo (yang lebar) tidak tampak "melar" di hasil PNG.
    logos.forEach(img=>{
      if (!img.naturalWidth || !img.naturalHeight) return;
      const r = img.getBoundingClientRect();
      const ratio = img.naturalWidth / img.naturalHeight;
      let w = r.height * ratio;
      let h = r.height;
      if (w > r.width){ w = r.width; h = w / ratio; }
      img.style.width = Math.round(w) + 'px';
      img.style.height = Math.round(h) + 'px';
    });

    try {
      const canvas = await html2canvas(frameEl, {
        scale: 2,
        useCORS: true,
        backgroundColor: null,
        logging: false
      });
      const a = document.createElement('a');
      a.download = 'undangan.png';
      a.href = canvas.toDataURL('image/png');
      a.click();
      if (window.cuelume) window.cuelume.play('success');
    } catch (err) {
      console.error(err);
      alert('Gagal menyimpan gambar: ' + err.message);
    } finally {
      logos.forEach(img=>{
        img.style.width = '';
        img.style.height = '';
      });
      if (navEl) navEl.style.display = '';
      saveBtn.disabled = false;
    }
  });
})();
</script>

<script>
// ---- Ganti tema terang/gelap ----
(function(){
  const btn = document.getElementById('themeBtn');
  if (!btn) return;
  btn.addEventListener('click', ()=>{
    const root = document.documentElement;
    const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try{ localStorage.setItem('theme', next); }catch(e){}
  });
})();
</script>
<script type="module">
// ---- Suara interaksi (cuelume) — selalu aktif ----
import { bind, play } from "https://esm.sh/cuelume";
window.cuelume = { play };
bind();
</script></body>
</html>
