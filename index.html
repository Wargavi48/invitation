<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>Undangan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="frame" id="frame">
  <div class="header">
    <div class="brand-mark brand-mark--host" id="hostMark">
      <span class="wordmark" id="hostTag">WARGAVI48</span>
    </div>
    <div class="brand-mark brand-mark--brand" id="brandMark">
      <span class="wordmark wordmark--brand" id="brandTag">KODOKNYAMAURA</span>
    </div>
  </div>

  <div class="slides" id="slides">

    <!-- SLIDE 1: COVER -->
    <div class="slide slide--cover">
      <div class="cover-scrim" aria-hidden="true"></div>
      <div class="cover-body">
        <span class="pill pill--category" id="categoryLabel">Undangan</span>
        <div class="eyebrow">Dear,</div>
        <div class="guest-name" id="guestName">Tamu Undangan</div>
      </div>
      <button class="button button--primary" id="openBtn">
        <span>Buka Undangan</span>
        <span class="button__divider"></span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>

    <!-- SLIDE 2: DETAILS -->
    <div class="slide">
      <div class="card card--intro">
        <div class="lead">Dear, <span class="accent" id="guestName2">Tamu Undangan</span></div>
        <div class="lead" id="hostGreeting">It is a pleasure to invite you to</div>
        <div class="event-title" id="eventName">Nama Acara</div>
      </div>
      <div class="card">
        <div class="row">
          <span class="row-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="16" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M3 10h18M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </span>
          <div>
            <div class="row-label">Waktu</div>
            <div class="row-value" id="eventTime">-</div>
          </div>
        </div>
        <div class="row">
          <span class="row-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 22s7-6.2 7-12a7 7 0 10-14 0c0 5.8 7 12 7 12z" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="10" r="2.4" stroke="currentColor" stroke-width="1.8"/></svg>
          </span>
          <div>
            <div class="row-label">Lokasi</div>
            <div class="row-value"><a id="eventPlace" href="#" target="_blank" rel="noopener">-</a></div>
          </div>
        </div>
      </div>
      <div class="notice">
        <p id="closingMessage">Terima kasih.</p>
      </div>
    </div>

  </div>

  <div class="nav">
    <button id="prevBtn" aria-label="Sebelumnya">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M19 12H5M11 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="dots" id="dots">
      <div class="dot active"></div>
      <div class="dot"></div>
    </div>
    <button id="nextBtn" aria-label="Berikutnya">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
(function(){
  const { SUPABASE_URL, SUPABASE_ANON_KEY, EVENT } = window.__INVITATION_CONFIG__;
  const supabase = (SUPABASE_URL.startsWith("http"))
    ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
    : null;

  // ---- Fill static content from config ----
  document.getElementById('hostTag').textContent = EVENT.hostTag;
  document.getElementById('brandTag').textContent = EVENT.brandTag;

  function renderMark(containerId, logoUrl, fallbackText, wordmarkClass, logoHeight){
    if (!logoUrl) return; // no logo configured yet — keep the text wordmark as-is
    const container = document.getElementById(containerId);
    const img = document.createElement('img');
    img.src = logoUrl;
    img.alt = fallbackText;
    img.className = 'brand-mark__logo';
    if (logoHeight) img.style.setProperty('--logo-height', logoHeight + 'px');
    img.onerror = function(){
      container.innerHTML = '';
      const span = document.createElement('span');
      span.className = 'wordmark' + (wordmarkClass ? ' ' + wordmarkClass : '');
      span.textContent = fallbackText;
      container.appendChild(span);
    };
    container.innerHTML = '';
    container.appendChild(img);
  }
  renderMark('hostMark', EVENT.hostLogoUrl, EVENT.hostTag, '', EVENT.hostLogoHeight);
  renderMark('brandMark', EVENT.brandLogoUrl, EVENT.brandTag, 'wordmark--brand', EVENT.brandLogoHeight);

  document.getElementById('categoryLabel').textContent = EVENT.category || 'Undangan';
  document.getElementById('hostGreeting').textContent = EVENT.hostGreeting;
  document.getElementById('eventName').textContent = EVENT.eventName;
  document.getElementById('eventTime').textContent = EVENT.date + " • " + EVENT.time;
  const placeEl = document.getElementById('eventPlace');
  placeEl.textContent = EVENT.place;
  placeEl.href = EVENT.placeMapUrl || '#';
  document.getElementById('closingMessage').textContent = EVENT.closingMessage;

  // ---- Guest lookup by slug (?to=slug) ----
  const params = new URLSearchParams(window.location.search);
  const slug = params.get('to');
  let guestId = null;

  async function loadGuest(){
    let name = EVENT.defaultGuestName;
    if (slug && supabase){
      try{
        const { data, error } = await supabase
          .from('guests')
          .select('id,name,greeting')
          .eq('slug', slug)
          .single();
        if (!error && data){
          name = data.greeting || data.name;
          guestId = data.id;
        }
      }catch(e){ console.warn('Guest lookup failed', e); }
    }
    document.getElementById('guestName').textContent = name;
    document.getElementById('guestName2').textContent = name;
  }
  loadGuest();

  async function markOpened(){
    if (guestId && supabase){
      try{
        await supabase.from('guests').update({ opened_at: new Date().toISOString() }).eq('id', guestId);
      }catch(e){ console.warn('Failed to mark opened', e); }
    }
  }

  // ---- Slide navigation ----
  const slidesEl = document.getElementById('slides');
  const dots = document.querySelectorAll('.dot');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const total = 2;
  let current = 0;

  function render(){
    slidesEl.style.transform = `translateX(-${current * (100/total)}%)`;
    dots.forEach((d,i)=> d.classList.toggle('active', i===current));
    prevBtn.disabled = current===0;
    nextBtn.disabled = current===total-1;
  }
  function goTo(i){
    current = Math.max(0, Math.min(total-1, i));
    render();
  }

  document.getElementById('openBtn').addEventListener('click', ()=>{
    markOpened();
    goTo(1);
  });
  prevBtn.addEventListener('click', ()=> goTo(current-1));
  nextBtn.addEventListener('click', ()=> goTo(current+1));

  // swipe support
  let touchStartX = null;
  const frame = document.getElementById('frame');
  frame.addEventListener('touchstart', e=>{ touchStartX = e.touches[0].clientX; });
  frame.addEventListener('touchend', e=>{
    if (touchStartX===null) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    if (Math.abs(dx) > 40){ dx < 0 ? goTo(current+1) : goTo(current-1); }
    touchStartX = null;
  });

  render();
})();
</script>
</body>
</html>
