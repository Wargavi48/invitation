<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>Undangan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Story+Script&display=swap" rel="stylesheet">
<meta name="color-scheme" content="light dark">
<script>
// Set tema sebelum CSS dipakai (hindari flash): pakai preferensi sistem atau pilihan tersimpan
(function(){
  try{
    var saved = localStorage.getItem('theme');
    var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  }catch(e){}
})();
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="stage">
<div class="frame" id="frame">
  <div class="header">
    <div class="brand-mark brand-mark--host" id="hostMark">
      <span class="wordmark" id="hostTag">WARGAVI48</span>
    </div>
    <div class="brand-mark brand-mark--brand" id="brandMark">
      <span class="wordmark wordmark--brand" id="brandTag">KODOKNYAMAURA</span>
    </div>
  </div>

  <div class="slides" id="slides">

    <!-- SLIDE 1: COVER -->
    <div class="slide slide--cover">
      <div class="cover-scrim" aria-hidden="true"></div>
      <div class="cover-body">
        <span class="pill pill--category" id="categoryLabel">Undangan</span>
        <div class="eyebrow" data-i18n="eyebrow">Dear,</div>
        <div class="guest-name" id="guestName">Tamu Undangan</div>
      </div>
      <button class="button button--primary" id="openBtn" data-cuelume-hover="pulse" data-cuelume-press data-cuelume-release>
        <span data-i18n="openBtn">Buka Undangan</span>
        <span class="button__divider"></span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M6 13l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>

    <!-- SLIDE 2: SURAT UNDANGAN -->
    <div class="slide slide--letter">
      <div class="letter-brand">
        <img class="letter-brand__img" id="letterBrandImg" alt="KodoknyaMaura" />
      </div>
      <div class="letter">
        <p class="letter__salutation"><span data-i18n="dear">Dear</span> <span id="guestName2">Tamu Undangan</span>,</p>
        <p class="letter__intro" id="hostGreeting">It is a pleasure to invite you to</p>
        <div class="letter__honoree" id="honoree">Maura Nilambari</div>
        <p class="letter__intro" id="hostGreetingAfter">…</p>
        <div class="letter__rule" aria-hidden="true"></div>
        <div class="letter__details-title" data-i18n="detailsTitle">Stream Details</div>
        <div class="letter__meta">
          <div class="letter__row">
            <span class="letter__label" data-i18n="labelDateTime">Date &amp; Time</span>
            <span class="letter__value" id="eventDateTime">-</span>
          </div>
          <div class="letter__row">
            <span class="letter__label" data-i18n="labelLink">Link</span>
            <span class="letter__value"><a id="eventPlace" href="#" target="_blank" rel="noopener">-</a></span>
          </div>
        </div>
        <p class="letter__closing" id="closingMessage">Terima kasih.</p>
      </div>
    </div>

  </div>

  <div class="nav">
    <div class="dots" id="dots">
      <div class="dot active" data-cuelume-hover="tick" data-cuelume-press></div>
      <div class="dot" data-cuelume-hover="tick" data-cuelume-press></div>
    </div>
  </div>
</div>

  <div class="stage-tools">
    <button class="save-btn" id="saveBtn" type="button" data-cuelume-hover="scan" data-cuelume-press data-cuelume-release>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 21h16" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span data-i18n="saveBtn">Simpan sebagai PNG</span>
    </button>
    <button class="theme-btn lang-btn" id="langBtn" type="button" data-cuelume-hover="tick" data-cuelume-toggle title="Ganti bahasa">🌐 <span id="langCode">ID</span></button>
    <button class="theme-btn" id="themeBtn" type="button" aria-label="Ganti tema terang/gelap" title="Ganti tema" data-i18n-title="themeTitle" data-cuelume-hover="tick" data-cuelume-toggle>
      <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M19.1 4.9l-1.8 1.8M6.7 17.3l-1.8 1.8"/></svg>
      <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
    </button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="config.js"></script>
<script>
(function(){
  const { SUPABASE_URL, SUPABASE_ANON_KEY } = window.__INVITATION_CONFIG__;
  const supabase = (SUPABASE_URL.startsWith("http"))
    ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
    : null;

  // ---- Wajib ada ?inv=<slug> ----
  // Tanpa ?inv= halaman tidak bisa diakses → redirect ke homepage (root GitHub Pages).
  const params = new URLSearchParams(window.location.search);
  const invSlug = params.get('inv');
  if (!invSlug){
    const home = (window.__INVITATION_CONFIG__ && window.__INVITATION_CONFIG__.INVITATION_URL)
      ? new URL(window.__INVITATION_CONFIG__.INVITATION_URL).origin + '/'
      : 'https://wargavi48.github.io/';
    window.location.replace(home);
    return; // hentikan eksekusi script
  }

  // ---- Muat konfigurasi undangan ----
  // Prioritas: ?inv=<slug> di URL → file invitations/<slug>.json di repo → fallback EVENT.
  let EVENT = window.__INVITATION_CONFIG__.EVENT;

  async function loadInvitationConfig(){
    if (invSlug){
      try{
        const res = await fetch('invitations/' + encodeURIComponent(invSlug) + '.json', { cache: 'no-store' });
        if (res.ok){
          const remote = await res.json();
          if (remote && typeof remote === 'object'){
            EVENT = Object.assign({}, EVENT, remote);
          }
        }
      }catch(e){
        console.warn('Gagal memuat undangan "' + invSlug + '", pakai fallback:', e);
      }
    }
    // Ekspos hasil merge supaya skrip lain (i18n, tema) memakai konfigurasi yang sama
    window.__ACTIVE_EVENT__ = EVENT;
  }

  // ---- Fill static content from config ----
  function applyTheme(){
    const root = document.documentElement;
    const t = EVENT.theme || {};
    if (t.brand) root.style.setProperty('--brand', t.brand);
    if (t.brandHover) root.style.setProperty('--brand-hover', t.brandHover);
    if (t.brandSoft) root.style.setProperty('--brand-soft', t.brandSoft);
    if (t.accent) root.style.setProperty('--accent', t.accent);
    if (t.bg) root.style.setProperty('--bg', t.bg);
    if (t.text) root.style.setProperty('--text', t.text);
    if (t.textMuted) root.style.setProperty('--text-muted', t.textMuted);
    if (t.surface) root.style.setProperty('--surface', t.surface);
    if (t.surfaceMuted) root.style.setProperty('--surface-muted', t.surfaceMuted);
    if (t.border) root.style.setProperty('--border', t.border);
    if (t.controlBg) root.style.setProperty('--control-bg', t.controlBg);
    if (t.controlText) root.style.setProperty('--control-text', t.controlText);
    if (t.fontSans) root.style.setProperty('--font-sans', t.fontSans);
    if (t.fontDisplay) root.style.setProperty('--font-display', t.fontDisplay);
    if (t.fontSerif) root.style.setProperty('--font-serif', t.fontSerif);
    if (t.fontHonoree) root.style.setProperty('--font-honoree', t.fontHonoree);
    // Latar kartu: backgroundImage (URL) atau backgroundColor
    if (t.backgroundImage) root.style.setProperty('--frame-bg', 'url("' + t.backgroundImage + '") center/cover no-repeat');
    else if (t.backgroundColor) root.style.setProperty('--frame-bg', t.backgroundColor);
  }

  function loadFonts(fonts){
    if (!fonts || !fonts.length) return;
    const families = fonts.map(f=> f.replace(/ /g, '+')).join('&family=');
    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = 'https://fonts.googleapis.com/css2?family=' + families + '&display=swap';
    document.head.appendChild(link);
    // Font pertama dipakai untuk nama yang dirayakan (honoree)
    document.documentElement.style.setProperty('--font-honoree', '"' + fonts[0] + '"');
  }

  function applyEvent(){
  applyTheme();
  loadFonts(EVENT.fonts);
  document.getElementById('hostTag').textContent = EVENT.hostTag;
  document.getElementById('brandTag').textContent = EVENT.brandTag;

  function renderMark(containerId, logoUrl, fallbackText, wordmarkClass, logoHeight){
    if (!logoUrl) return; // no logo configured yet — keep the text wordmark as-is
    const container = document.getElementById(containerId);
    const img = document.createElement('img');
    img.src = logoUrl;
    img.alt = fallbackText;
    img.className = 'brand-mark__logo';
    if (logoHeight) img.style.setProperty('--logo-height', logoHeight + 'px');
    img.onerror = function(){
      container.innerHTML = '';
      const span = document.createElement('span');
      span.className = 'wordmark' + (wordmarkClass ? ' ' + wordmarkClass : '');
      span.textContent = fallbackText;
      container.appendChild(span);
    };
    container.innerHTML = '';
    container.appendChild(img);
  }
  renderMark('hostMark', EVENT.hostLogoUrl, EVENT.hostTag, '', EVENT.hostLogoHeight);
  renderMark('brandMark', EVENT.brandLogoUrl, EVENT.brandTag, 'wordmark--brand', EVENT.brandLogoHeight);

  // Logo brand di slide 2 (surat) — tampil terpusat di atas kartu surat
  const letterBrandImg = document.getElementById('letterBrandImg');
  if (letterBrandImg){
    if (EVENT.brandLogoUrl){
      letterBrandImg.src = EVENT.brandLogoUrl;
      if (EVENT.brandLogoHeight) letterBrandImg.style.setProperty('--logo-height', EVENT.brandLogoHeight + 'px');
      letterBrandImg.onerror = function(){ letterBrandImg.style.display = 'none'; };
    } else {
      letterBrandImg.style.display = 'none';
    }
  }

  document.getElementById('categoryLabel').textContent = EVENT.category || (EVENT.i18n && EVENT.i18n.category && EVENT.i18n.category.en) || 'Undangan';
  document.getElementById('hostGreeting').textContent = EVENT.hostGreeting || (EVENT.i18n && EVENT.i18n.hostGreeting && EVENT.i18n.hostGreeting.en) || '';
  const honoreeEl = document.getElementById('honoree');
  if (honoreeEl) honoreeEl.textContent = EVENT.honoreeName || '';
  const hostGreetingAfterEl = document.getElementById('hostGreetingAfter');
  if (hostGreetingAfterEl) hostGreetingAfterEl.textContent = EVENT.hostGreetingAfter || (EVENT.i18n && EVENT.i18n.hostGreetingAfter && EVENT.i18n.hostGreetingAfter.en) || '';
  const eventDateTimeEl = document.getElementById('eventDateTime');
  if (eventDateTimeEl) eventDateTimeEl.textContent = ((EVENT.date || (EVENT.i18n && EVENT.i18n.date && EVENT.i18n.date.en)) + " • " + EVENT.time).trim();
  const placeEl = document.getElementById('eventPlace');
  placeEl.textContent = EVENT.place || (EVENT.i18n && EVENT.i18n.place && EVENT.i18n.place.en) || '';
  placeEl.href = EVENT.placeMapUrl || '#';
  document.getElementById('closingMessage').textContent = EVENT.closingMessage || (EVENT.i18n && EVENT.i18n.closingMessage && EVENT.i18n.closingMessage.en) || '';
  }

  // ---- Guest lookup by slug (?to=slug) ----
  const slug = params.get('to');
  let guestId = null;

  async function loadGuest(){
    let name = EVENT.defaultGuestName || (EVENT.i18n && EVENT.i18n.defaultGuestName && EVENT.i18n.defaultGuestName.en) || 'Tamu Undangan';
    if (slug && supabase){
      try{
        const { data, error } = await supabase
          .from('guests')
          .select('*')
          .eq('slug', slug)
          .single();
        if (!error && data){
          name = data.greeting || data.name;
          guestId = data.id;
        }
      }catch(e){ console.warn('Guest lookup failed', e); }
    }
    document.getElementById('guestName').textContent = name;
    document.getElementById('guestName2').textContent = name;
  }

  (async function init(){
    await loadInvitationConfig();
    applyEvent();
    if (window.__applyLang) window.__applyLang();
    loadGuest();
  })();

  async function markOpened(){
    if (guestId && supabase){
      try{
        await supabase.from('guests').update({ opened_at: new Date().toISOString() }).eq('id', guestId);
      }catch(e){ console.warn('Failed to mark opened', e); }
    }
  }

  // ---- Slide navigation ----
  const slidesEl = document.getElementById('slides');
  const dots = document.querySelectorAll('.dot');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const total = 2;
  let current = 0;

  function render(){
    slidesEl.style.transform = `translateY(-${current * (100/total)}%)`;
    dots.forEach((d,i)=> d.classList.toggle('active', i===current));
    if (prevBtn) prevBtn.disabled = current===0;
    if (nextBtn) nextBtn.disabled = current===total-1;
  }
  function goTo(i){
    current = Math.max(0, Math.min(total-1, i));
    render();
  }

  document.getElementById('openBtn').addEventListener('click', ()=>{
    markOpened();
    goTo(1);
  });
  if (prevBtn) prevBtn.addEventListener('click', ()=> goTo(current-1));
  if (nextBtn) nextBtn.addEventListener('click', ()=> goTo(current+1));
  dots.forEach((d,i)=> d.addEventListener('click', ()=> goTo(i)));

  // swipe support
  let touchStart = null;
  const frame = document.getElementById('frame');
  frame.addEventListener('touchstart', e=>{ touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY }; });
  frame.addEventListener('touchend', e=>{
    if (touchStart===null) return;
    const dy = e.changedTouches[0].clientY - touchStart.y;
    touchStart = null;
    if (Math.abs(dy) > 40){ dy < 0 ? goTo(current+1) : goTo(current-1); }
  });

  render();
})();
</script>

<script>
// ---- Simpan undangan sebagai gambar PNG ----
(function(){
  const saveBtn = document.getElementById('saveBtn');
  if (!saveBtn || !window.html2canvas) return;

  saveBtn.addEventListener('click', async ()=>{
    const frameEl = document.getElementById('frame');
    const navEl = document.querySelector('.nav');
    const logos = Array.from(document.querySelectorAll('.brand-mark__logo'));
    saveBtn.disabled = true;
    if (navEl) navEl.style.display = 'none'; // sembunyikan tombol nav biar hasilnya rapi

    // html2canvas tidak mendukung object-fit:contain → samakan ukuran kotak img dengan rasio
    // asli gambar, supaya logo (yang lebar) tidak tampak "melar" di hasil PNG.
    logos.forEach(img=>{
      if (!img.naturalWidth || !img.naturalHeight) return;
      const r = img.getBoundingClientRect();
      const ratio = img.naturalWidth / img.naturalHeight;
      let w = r.height * ratio;
      let h = r.height;
      if (w > r.width){ w = r.width; h = w / ratio; }
      img.style.width = Math.round(w) + 'px';
      img.style.height = Math.round(h) + 'px';
    });

    // html2canvas gagal saat ada background-image data:URI SVG (mis. .cover-scrim::before)
    // atau gambar latar berukuran sangat besar (mis. 3041x4257) → "createPattern width/height 0".
    // Ditangani oleh downscaleBackgroundImages() di bawah + pemulihan di finally.

    try {
      // Prapemrosesan: gambar latar yang sangat besar (mis. 3041x4257) bikin
      // html2canvas gagal "createPattern width/height 0". Turunkan ukurannya
      // jadi versi kecil sebagai data-URI, dipakai saat capture lalu dikembalikan.
      const bgFix = await downscaleBackgroundImages();
      const canvas = await html2canvas(frameEl, {
        scale: 2,
        useCORS: true,
        backgroundColor: '#ffffff',
        logging: false
      });
      bgFix.restore();
      // Simpan PNG. Pakai toBlob + URL.createObjectURL() (bukan toDataURL) supaya
      // kompatibel dengan iOS Safari yang memblokir unduhan data-URI base64 besar.
      const blob = await new Promise(resolve=> canvas.toBlob(resolve, 'image/png'));
      if (!blob){ throw new Error('Gagal membuat file gambar'); }
      const url = URL.createObjectURL(blob);
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      if (isIOS){
        // iOS: buka blob di tab baru agar pengguna bisa "Save Image" dari menu saham.
        const w = window.open(url, '_blank');
        if (!w){ prompt('Simpan gambar ini (tahan / save image):', url); }
      } else {
        const a = document.createElement('a');
        a.download = 'undangan.png';
        a.href = url;
        document.body.appendChild(a);
        a.click();
        a.remove();
      }
      setTimeout(()=> URL.revokeObjectURL(url), 4000);
      if (window.cuelume) window.cuelume.play('success');
    } catch (err) {
      console.error(err);
      alert('Gagal menyimpan gambar: ' + err.message);
    } finally {
      // pastikan background pulih walau error
      document.querySelectorAll('[data-bg-orig]').forEach(el=>{
        const orig = el.getAttribute('data-bg-orig');
        if (orig) el.style.backgroundImage = orig;
        el.removeAttribute('data-bg-orig');
      });
      logos.forEach(img=>{
        img.style.width = '';
        img.style.height = '';
      });
      if (navEl) navEl.style.display = '';
      saveBtn.disabled = false;
    }
  });

  async function downscaleBackgroundImages(){
    // Kembalikan bg pseudo-element dulu supaya tampil
    const fixed = [];
    for (const el of document.querySelectorAll('*')){
      const bg = getComputedStyle(el).backgroundImage;
      if (!bg || bg === 'none') continue;
      const urls = [...bg.matchAll(/url\(\s*["']?(.*?)["']?\s*\)/g)].map(m=>m[1]);
      if (!urls.length) continue;
      let replaced = false;
      const parts = [];
      for (let i = 0; i < bg.length;){
        const m = /url\(["']?([^"')]+)["']?\)/.exec(bg.slice(i));
        if (!m){ parts.push(bg.slice(i)); break; }
        parts.push(bg.slice(i, i + m.index));
        const rawUrl = m[1];
        // abaikan data:URI (termasuk svg) & yang sudah data-image
        if (/^data:/.test(rawUrl)){ parts.push(m[0]); i += m.index + m[0].length; continue; }
        // hanya tangani url http/https yang bisa dimuat
        if (/^https?:\/\//.test(rawUrl)){
          const down = await new Promise(resolve=>{
            const img = new Image();
            img.crossOrigin = 'anonymous';
            img.onload = ()=>{
              if (img.naturalWidth > 1600 || img.naturalHeight > 1600){
                const scale = Math.min(1, 1600/img.naturalWidth, 1600/img.naturalHeight);
                const c = document.createElement('canvas');
                c.width = Math.round(img.naturalWidth*scale);
                c.height = Math.round(img.naturalHeight*scale);
                c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
                resolve('url("' + c.toDataURL('image/jpeg', 0.85) + '")');
              } else {
                resolve(m[0]);
              }
            };
            img.onerror = ()=> resolve(m[0]);
            img.src = rawUrl;
          });
          parts.push(down);
          replaced = true;
          i += m.index + m[0].length;
        } else {
          parts.push(m[0]); i += m.index + m[0].length;
        }
      }
      if (replaced){
        el.setAttribute('data-bg-orig', el.style.backgroundImage || getComputedStyle(el).backgroundImage);
        el.style.backgroundImage = parts.join('');
        fixed.push(el);
      }
    }
    return { restore(){
      fixed.forEach(el=>{
        const orig = el.getAttribute('data-bg-orig');
        if (orig) el.style.backgroundImage = orig;
        el.removeAttribute('data-bg-orig');
      });
    }};
  }
})();
</script>

<script>
// ---- Ganti tema terang/gelap ----
(function(){
  const btn = document.getElementById('themeBtn');
  if (!btn) return;
  btn.addEventListener('click', ()=>{
    const root = document.documentElement;
    const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try{ localStorage.setItem('theme', next); }catch(e){}
  });
})();
</script>
<script>
// ---- Lokalisasi EN/ID ----
(function(){
  const I18N = {
    en: {
      openBtn: "Open Invitation",
      saveBtn: "Save as PNG",
      themeTitle: "Toggle light/dark theme",
      langTitle: "Switch to Indonesian",
      eyebrow: "Dear,",
      dear: "Dear",
      detailsTitle: "Stream Details",
      labelDateTime: "Date & Time",
      labelLink: "Link",
      category: "Graduation",
      hostGreeting: "You are warmly invited to attend the graduation of",
      hostGreetingAfter: "As a valued part of this community, your presence would mean a great deal as we celebrate her journey and say farewell together.",
      closingMessage: "Let us gather one final time to #makeitMemaurable, honor her journey, and wish her the very best in her next chapter."
    },
    id: {
      openBtn: "Buka Undangan",
      saveBtn: "Simpan sebagai PNG",
      themeTitle: "Ganti tema terang/gelap",
      langTitle: "Ganti ke Bahasa Inggris",
      eyebrow: "Dear,",
      dear: "Dear",
      detailsTitle: "Detail Acara",
      labelDateTime: "Tanggal & Waktu",
      labelLink: "Tautan",
      category: "Wisuda",
      hostGreeting: "Dengan hangat kami mengundang Anda untuk menghadiri prosesi kelulusan dari",
      hostGreetingAfter: "Sebagai bagian berharga dari komunitas ini, kehadiran Anda sangat berarti bagi kami.",
      closingMessage: "Mari berkumpul untuk melepas dan menghormati perjalanan serta mendoakan yang terbaik di babak berikutnya! #makeitMemaurable"
    }
  };

  const EN_DAYS   = { Sunday:'Minggu', Monday:'Senin', Tuesday:'Selasa', Wednesday:'Rabu', Thursday:'Kamis', Friday:'Jumat', Saturday:'Sabtu' };
  const EN_MONTHS = { January:'Januari', February:'Februari', March:'Maret', April:'April', May:'Mei', June:'Juni', July:'Juli', August:'Agustus', September:'September', October:'Oktober', November:'November', December:'Desember' };

  let lang = 'id';
  try{ lang = localStorage.getItem('lang') || 'id'; }catch(e){}

  function localizeDate(str){
    if (!str || lang === 'en') return str;
    let out = String(str);
    Object.keys(EN_MONTHS).forEach(en => { out = out.replace(en, EN_MONTHS[en]); });
    Object.keys(EN_DAYS).forEach(en => { out = out.replace(en, EN_DAYS[en]); });
    return out;
  }

  function setText(id, value){
    const el = document.getElementById(id);
    if (el && value !== undefined && value !== null) el.textContent = value;
  }

  function applyLang(l){
    if (!l) l = lang;
    const t = I18N[l] || I18N.en;
    document.querySelectorAll('[data-i18n]').forEach(el=>{
      const key = el.getAttribute('data-i18n');
      if (t[key] !== undefined) el.textContent = t[key];
    });
    document.querySelectorAll('[data-i18n-title]').forEach(el=>{
      const key = el.getAttribute('data-i18n-title');
      if (t[key] !== undefined) el.title = t[key];
    });

    // Konten dinamis — EN/ID dari EVENT aktif (fallback atau JSON undangan)
    const ev = window.__ACTIVE_EVENT__ || (window.__INVITATION_CONFIG__ && window.__INVITATION_CONFIG__.EVENT) || {};
    const invI18n = ev.i18n || {};
    const pick = key => {
      // prioritas: terjemahan per-undangan → kamus bawaan → nilai EVENT
      if (invI18n[key] && invI18n[key][l]) return invI18n[key][l];
      if (t[key] !== undefined) return t[key];
      return ev[key];
    };
    setText('categoryLabel', pick('category'));
    setText('hostGreeting', pick('hostGreeting'));
    setText('hostGreetingAfter', pick('hostGreetingAfter'));
    setText('closingMessage', pick('closingMessage'));
    const dt = localizeDate(pick('date'));
    const tm = ev.time || '';
    setText('eventDateTime', (dt + (tm ? ' • ' + tm : '')).trim());
    setText('eventPlace', pick('place'));

    const code = document.getElementById('langCode');
    if (code) code.textContent = l.toUpperCase();
    document.documentElement.setAttribute('lang', l);
    try{ localStorage.setItem('lang', l); }catch(e){}
  }

  const langBtn = document.getElementById('langBtn');
  if (langBtn){
    langBtn.addEventListener('click', ()=>{
      lang = lang === 'en' ? 'id' : 'en';
      applyLang(lang);
    });
    langBtn.setAttribute('data-i18n-title', 'langTitle');
  }
  // Dipanggil lagi setelah konfigurasi undangan dimuat (async), supaya
  // terjemahan per-undangan (i18n di JSON) ikut diterapkan.
  window.__applyLang = applyLang;
  applyLang(lang);
})();
</script>
